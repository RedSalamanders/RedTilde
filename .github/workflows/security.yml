  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '29 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  security:
    uses: RedSalamanders/.github/.github/workflows/security.yml@34906afc663b6d17ea66f1133a0e9283f476a8b9
    with:
      engine_ref: 34906afc663b6d17ea66f1133a0e9283f476a8b9
