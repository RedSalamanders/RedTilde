name: Manual paired benchmark
on:
  workflow_dispatch:
    inputs:
      benchmark_baseline:
        description: Exact baseline commit with the same harness and dependency pins
        type: string
        required: true
      evidence_recipient:
        description: Base64 DER public RSA certificate for the full evidence packet
        type: string
        required: true
permissions:
  contents: read
jobs:
  paired-benchmark:
    name: paired-benchmark
    runs-on: windows-2025-vs2026
    timeout-minutes: 240
    steps:
      - name: Enable long Windows checkout paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the reviewed CI engine commit
        id: engine
        shell: pwsh
        run: |
          $pin = (Get-Content -LiteralPath .ci/project.json -Raw | ConvertFrom-Json).engine.ref
          if ($pin -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid CI engine commit.' }
          "ref=$pin" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RedSalamanders/.github
          ref: ${{ steps.engine.outputs.ref }}
          path: .ci-engine
          persist-credentials: false
      - name: Prepare the pinned native toolchain
        uses: ./.ci-engine/.github/actions/setup-msvc
        with:
          platform: x64
      - name: Compare exact Release sources
        shell: pwsh
        timeout-minutes: 220
        env:
          BENCHMARK_BASELINE: ${{ inputs.benchmark_baseline }}
          BENCHMARK_RECIPIENT: ${{ inputs.evidence_recipient }}
        run: ./Tools/Invoke-HostedBenchmark.ps1 -BaselineRevision $env:BENCHMARK_BASELINE -RecipientCertificate $env:BENCHMARK_RECIPIENT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: paired-benchmark-x64-Release
          path: |
            .build/hosted-benchmark/summary.json
            .build/hosted-benchmark/evidence.p7m
          if-no-files-found: ignore
